[project]
name = "hl-toolkit"
version = "0.1.0"
description = "Read-only Hyperliquid clients for asyncio: a reconnecting websocket fills feed and a rate-limit-aware Info API client"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "wvydev" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
]
keywords = ["hyperliquid", "asyncio", "websocket", "trading", "api-client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hltoolkit"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
